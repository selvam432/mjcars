<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>MJ MINIATURES · Collect. Display. Inspire.</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* --- RESET & GLOBAL --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }
    body {
      background-color: #0b0b0b;
      color: #f0f0f0;
      line-height: 1.6;
      padding: 0 0 80px 0;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 20px;
    }
    /* --- HEADER / NAV --- */
    header {
      background: #0f0f0f;
      border-bottom: 1px solid #2a2a2a;
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    .header-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .logo h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
    }
    .logo span {
      color: #e31b23;
    }
    .logo small {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 3px;
      color: #aaa;
      margin-top: -4px;
    }
    .nav-menu {
      display: flex;
      gap: 28px;
      font-weight: 500;
      font-size: 1rem;
    }
    .nav-menu a {
      color: #ccc;
      transition: 0.2s;
      border-bottom: 2px solid transparent;
      padding-bottom: 4px;
    }
    .nav-menu a:hover,
    .nav-menu a.active {
      color: #fff;
      border-bottom-color: #e31b23;
    }
    .cart-icon {
      position: relative;
      font-size: 1.6rem;
      color: #ddd;
      cursor: pointer;
      margin-left: 10px;
    }
    .cart-icon .badge {
      position: absolute;
      top: -8px;
      right: -12px;
      background: #e31b23;
      color: #fff;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 30px;
      min-width: 22px;
      text-align: center;
    }
    .mobile-toggle {
      display: none;
      font-size: 1.8rem;
      color: #ccc;
      cursor: pointer;
    }
    /* --- HERO --- */
    .hero {
      padding: 70px 0 50px;
      background: linear-gradient(145deg, #0e0e0e, #151515);
      border-radius: 20px;
      margin: 30px 0 40px;
      text-align: center;
      border: 1px solid #282828;
    }
    .hero h2 {
      font-size: 3.4rem;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .hero h2 span {
      color: #e31b23;
    }
    .hero .tagline {
      font-size: 1.6rem;
      color: #bbb;
      margin: 10px 0 20px;
      font-weight: 300;
      letter-spacing: 6px;
    }
    .hero p {
      max-width: 600px;
      margin: 10px auto 30px;
      color: #aaa;
      font-size: 1.1rem;
    }
    .btn-primary {
      background: #e31b23;
      border: none;
      color: #fff;
      padding: 14px 44px;
      font-size: 1.2rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.2s;
      display: inline-block;
      box-shadow: 0 4px 14px rgba(227, 27, 35, 0.3);
    }
    .btn-primary:hover {
      background: #c01018;
      transform: scale(1.02);
    }
    /* --- CATEGORIES --- */
    .categories {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin: 40px 0 30px;
    }
    .category-btn {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      color: #ddd;
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.95rem;
    }
    .category-btn.active,
    .category-btn:hover {
      background: #e31b23;
      border-color: #e31b23;
      color: #fff;
    }
    /* --- PRODUCT GRID --- */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 30px;
      margin: 30px 0 50px;
    }
    .product-card {
      background: #121212;
      border-radius: 20px;
      padding: 20px 16px 22px;
      border: 1px solid #282828;
      transition: 0.25s;
      display: flex;
      flex-direction: column;
      box-shadow: 0 6px 12px rgba(0,0,0,0.6);
    }
    .product-card:hover {
      transform: translateY(-6px);
      border-color: #e31b23;
      box-shadow: 0 12px 24px rgba(227,27,35,0.15);
    }
    /* --- FIXED: IMAGE CONTAINER & SIZING --- */
    .product-card .image-container {
      width: 100%;
      height: 190px;
      background: #1c1c1c;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .product-card .image-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;  /* Ensures the entire image is visible */
      transition: transform 0.3s ease;
    }
    .product-card:hover .image-container img {
      transform: scale(1.03);
    }
    .product-card h3 {
      font-size: 1.2rem;
      font-weight: 600;
    }
    .product-card .category-tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #e31b23;
      letter-spacing: 1px;
      margin: 2px 0 6px;
    }
    .product-card .price {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin: 6px 0 10px;
    }
    .product-card .desc {
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 14px;
      flex: 1;
    }
    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }
    .btn-whatsapp,
    .btn-details {
      padding: 8px 14px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.8rem;
      border: none;
      cursor: pointer;
      transition: 0.2s;
      flex: 1 0 auto;
    }
    .btn-whatsapp {
      background: #25D366;
      color: #fff;
    }
    .btn-whatsapp:hover {
      background: #1da855;
    }
    .btn-details {
      background: #2a2a2a;
      color: #ddd;
    }
    .btn-details:hover {
      background: #3a3a3a;
      color: #fff;
    }
    /* --- WHY CHOOSE --- */
    .why-choose {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
      gap: 30px;
      background: #111;
      padding: 40px 30px;
      border-radius: 30px;
      margin: 40px 0;
      border: 1px solid #262626;
    }
    .why-item {
      text-align: center;
    }
    .why-item i {
      font-size: 2.6rem;
      color: #e31b23;
      margin-bottom: 10px;
    }
    .why-item h4 {
      font-size: 1.2rem;
    }
    .why-item p {
      color: #aaa;
      font-size: 0.9rem;
    }
    /* --- CART OVERLAY --- */
    .cart-overlay {
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.7);
      z-index: 999;
      display: none;
      justify-content: flex-end;
    }
    .cart-overlay.open {
      display: flex;
    }
    .cart-panel {
      background: #111;
      width: 380px;
      max-width: 90%;
      padding: 24px 20px;
      overflow-y: auto;
      border-left: 2px solid #e31b23;
      color: #eee;
    }
    .cart-panel h2 {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #333;
      padding-bottom: 14px;
    }
    .cart-panel .close-cart {
      background: none;
      border: none;
      color: #ccc;
      font-size: 1.8rem;
      cursor: pointer;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #262626;
    }
    .cart-item .item-info {
      flex: 2;
    }
    .cart-item .item-qty {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .cart-item .item-qty button {
      background: #2a2a2a;
      border: none;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
    }
    .cart-item .item-qty span {
      min-width: 24px;
      text-align: center;
    }
    .cart-total {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 20px 0 12px;
    }
    .btn-order-cart {
      background: #25D366;
      color: #fff;
      border: none;
      padding: 14px;
      width: 100%;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1.2rem;
      cursor: pointer;
    }
    /* --- FLOATING WHATSAPP --- */
    .float-wa {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #25D366;
      color: #fff;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
      z-index: 200;
      transition: 0.2s;
      border: none;
      cursor: pointer;
    }
    .float-wa:hover {
      transform: scale(1.08);
    }
    /* --- FOOTER --- */
    footer {
      margin-top: 50px;
      border-top: 1px solid #232323;
      padding: 40px 0 20px;
      text-align: center;
      color: #777;
      font-size: 0.9rem;
    }
    .footer-social a {
      color: #bbb;
      margin: 0 14px;
      font-size: 1.6rem;
      transition: 0.2s;
    }
    .footer-social a:hover {
      color: #e31b23;
    }
    /* --- RESPONSIVE --- */
    @media (max-width: 768px) {
      .mobile-toggle { display: block; }
      .nav-menu {
        display: none;
        flex-direction: column;
        width: 100%;
        padding: 20px 0 10px;
        gap: 18px;
        text-align: center;
      }
      .nav-menu.open { display: flex; }
      .hero h2 { font-size: 2.4rem; }
      .hero .tagline { font-size: 1.2rem; }
      .product-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
      .cart-panel { width: 100%; max-width: 100%; }
    }
    /* --- MODAL --- */
    .modal {
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.open { display: flex; }
    .modal-content {
      background: #181818;
      max-width: 600px;
      width: 100%;
      border-radius: 30px;
      padding: 30px;
      border: 1px solid #333;
      color: #eee;
      position: relative;
    }
    /* --- FIXED: Modal image container --- */
    .modal-content .modal-image-container {
      width: 100%;
      max-height: 300px;
      background: #121212;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .modal-content .modal-image-container img {
      width: 100%;
      height: 100%;
      max-height: 300px;
      object-fit: contain;
    }
    .modal-close {
      position: absolute;
      top: 14px;
      right: 20px;
      font-size: 2rem;
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
    }
    .modal .price { font-size: 1.8rem; color: #e31b23; }
    .modal .meta { color: #aaa; font-size: 0.9rem; margin: 4px 0; }
    .modal .qty-selector {
      display: flex;
      gap: 12px;
      align-items: center;
      margin: 16px 0;
    }
    .modal .qty-selector button {
      background: #2a2a2a;
      border: none;
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 40px;
      font-size: 1.4rem;
      cursor: pointer;
    }
    .modal .qty-selector span {
      font-size: 1.4rem;
      min-width: 40px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-wrapper">
      <div class="logo">
        <h1>MJ <span>MINIATURES</span></h1>
        <small>Collect. Display. Inspire.</small>
      </div>
      <div class="mobile-toggle" id="mobileToggle"><i class="fas fa-bars"></i></div>
      <nav class="nav-menu" id="navMenu">
        <a href="#" class="active" data-page="home">Home</a>
        <a href="#" data-page="shop">Shop</a>
        <a href="#" data-page="about">About</a>
        <a href="#" data-page="contact">Contact</a>
      </nav>
      <div class="cart-icon" id="cartIcon">
        <i class="fas fa-shopping-cart"></i>
        <span class="badge" id="cartBadge">0</span>
      </div>
    </div>
  </header>

  <main class="container" id="mainContent"></main>

  <button class="float-wa" id="floatWa" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></button>

  <div class="cart-overlay" id="cartOverlay">
    <div class="cart-panel">
      <h2>🛒 Your Cart <button class="close-cart" id="closeCart">&times;</button></h2>
      <div id="cartItems"></div>
      <div class="cart-total" id="cartTotal">Total: ₹0</div>
      <button class="btn-order-cart" id="orderCartBtn"><i class="fab fa-whatsapp"></i> Order Cart on WhatsApp</button>
    </div>
  </div>

  <div class="modal" id="productModal">
    <div class="modal-content" id="modalContent">
      <button class="modal-close" id="modalClose">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <footer>
    <div class="footer-social">
      <a href="#" id="instagramLink" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="#" id="youtubeLink" target="_blank"><i class="fab fa-youtube"></i></a>
      <a href="#" id="whatsappFooterLink" target="_blank"><i class="fab fa-whatsapp"></i></a>
    </div>
    <p style="margin-top:16px;">&copy; 2026 MJ MINIATURES — All rights reserved.</p>
  </footer>

  <script>
    (function() {
      // ============================================================
      //  CONFIGURATION - EDIT THESE VALUES
      // ============================================================
      const CONFIG = {
        whatsappNumber: '7339167220',   // Your WhatsApp number
        instagramUrl: 'https://instagram.com/mjminiatures',
        youtubeUrl: 'https://youtube.com/mjminiatures',
        phone: '+91 73391 67220',
        email: 'info@mjminiatures.com'
      };

      // ============================================================
      //  PRODUCTS DATA - EASY TO EDIT
      //  The first product uses your Google Drive image.
      // ============================================================
      let products = [
        {
          id: 1,
          name: 'F1 Car',
          category: 'Die-Cast Cars',
          price: 300,
          description: '1:39 scale die-cast, metallic orange.',
          image: 'https://drive.google.com/thumbnail?id=1tj_SSsMv5KDHT22ihYNbaihMawDCrVHa&sz=w1000',

        },
        {
          id: 2,

          category: 'Die-Cast Cars',
          price: 300,
          description: 'Classic red Ferrari, detailed interior.',
          image: 'https://drive.google.com/thumbnail?id=16APagsMgu2D9L_ah-xYPh1bOeMhHhpJ7&sz=w1000',
          scale: '1:64',
          material: 'Die-cast metal',
          color: 'Red',
          availability: 'In Stock'
        },
        {
          id: 3,
          name: 'F1 Red Bull RB18',
          category: 'F1',
          price: 350,
          description: '2022 season champion, 1:43 scale.',
          image: 'https://drive.google.com/thumbnail?id=1udoXXv5Sh4EpKRSkPOlV_TIQx2djhabO&sz=w1000',
          scale: '1:43',
          material: 'Resin & metal',
          color: 'Navy/Red',
          availability: 'In Stock'
        },
        {
          id: 4,
          name: 'F1 Mercedes W13',
          category: 'F1 Cars',
          price: 350,
          description: 'Silver arrow, detailed aerodynamic.',
          image: 'https://drive.google.com/thumbnail?id=16APagsMgu2D9L_ah-xYPh1bOeMhHhpJ7&sz=w1000',
          scale: '1:43',
          material: 'Die-cast',
          color: 'Silver/Black',
          availability: 'Pre-order'
        },
        {
          id: 5,
          name: 'Yamaha YZF-R1',
          category: 'Bikes',
          price: 350,
          description: '1:18 scale superbike, blue/black.',
          image: 'https://drive.google.com/file/d/1edbe_16JTb_qGLMh3su7knZiI2anuG9D/view?usp=drive_link',
          scale: '1:18',
          material: 'Plastic & metal',
          color: 'Blue',
          availability: 'In Stock'
        },
        {
          id: 6,
          name: 'Ducati Panigale V4',
          category: 'Bikes',
          price: 350,
          description: 'Red Italian superbike, 1:18 scale.',
          image: 'https://drive.google.com/file/d/1v-oSRmWIfIO0SX014kon69Dc9P8etyeu/view?usp=drive_link',
          scale: '1:18',
          material: 'Die-cast',
          color: 'Red',
          availability: 'In Stock'
        },
        {
          id: 7,
          name: 'Porsche 911 Turbo',
          category: 'Die-Cast Cars',
          price: 300,
          description: 'Silver, 1:64 scale, opening doors.',
          image: 'https://drive.google.com/file/d/1nMYg22mAghVkpTKUNDwaQiBcmSacL2o-/view?usp=drive_link',
          scale: '1:64',
          material: 'Zinc alloy',
          color: 'Silver',
          availability: 'In Stock'
        }
      ];

      // ===== state =====
      let cart = [];
      let currentCategory = 'All';
      let currentPage = 'home';

      const main = document.getElementById('mainContent');
      const cartOverlay = document.getElementById('cartOverlay');
      const cartItemsDiv = document.getElementById('cartItems');
      const cartTotalDiv = document.getElementById('cartTotal');
      const cartBadge = document.getElementById('cartBadge');
      const productModal = document.getElementById('productModal');
      const modalBody = document.getElementById('modalBody');

      function formatPrice(p) { return '₹' + p; }
      function getProductById(id) { return products.find(p => p.id === id); }

      function renderHome() {
        const hero = `
          <div class="hero">
            <h2>MJ <span>MINIATURES</span></h2>
            <div class="tagline">Collect. Display. Inspire.</div>
            <p>Premium die-cast cars, F1 models, bikes and collectibles for enthusiasts and collectors.</p>
            <a href="#" class="btn-primary" id="shopNowBtn">Shop Now</a>
          </div>
        `;
        const categoriesHtml = `
          <div class="categories" id="categoryFilter">
            <button class="category-btn active" data-cat="All">All</button>
            <button class="category-btn" data-cat="Die-Cast Cars">Die-Cast Cars</button>
            <button class="category-btn" data-cat="F1 Cars">F1 Cars</button>
            <button class="category-btn" data-cat="Bikes">Bikes</button>
          </div>
        `;
        const grid = `<div class="product-grid" id="productGrid"></div>`;
        const why = `
          <div class="why-choose">
            <div class="why-item"><i class="fas fa-truck"></i><h4>Fast Shipping</h4><p>Pan India delivery</p></div>
            <div class="why-item"><i class="fas fa-shield-alt"></i><h4>Secure Packaging</h4><p>Safe die-cast models</p></div>
            <div class="why-item"><i class="fas fa-hand-holding-heart"></i><h4>Collector Focus</h4><p>Quality you trust</p></div>
          </div>
        `;
        main.innerHTML = hero + categoriesHtml + grid + why;

        document.querySelectorAll('.category-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentCategory = this.dataset.cat;
            renderProducts();
          });
        });
        document.getElementById('shopNowBtn')?.addEventListener('click', (e) => {
          e.preventDefault();
          navigateTo('shop');
        });
        renderProducts();
      }

      function renderProducts() {
        const grid = document.getElementById('productGrid');
        if (!grid) return;
        const filtered = currentCategory === 'All' ? products : products.filter(p => p.category === currentCategory);
        if (filtered.length === 0) {
          grid.innerHTML = `<p style="color:#aaa; text-align:center; padding:40px;">No products in this category.</p>`;
          return;
        }
        grid.innerHTML = filtered.map(p => `
          <div class="product-card" data-id="${p.id}">
            <div class="image-container">
              <img src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.src='https://placehold.co/400x300/1a1a1a/e31b23?text=Image+Not+Found'">
            </div>
            <h3>${p.name}</h3>
            <div class="category-tag">${p.category}</div>
            <div class="price">${formatPrice(p.price)}</div>
            <div class="desc">${p.description}</div>
            <div class="card-actions">
              <button class="btn-details" data-id="${p.id}">View Details</button>
              <button class="btn-whatsapp" data-id="${p.id}"><i class="fab fa-whatsapp"></i> Order</button>
            </div>
          </div>
        `).join('');

        grid.querySelectorAll('.btn-details').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = parseInt(this.dataset.id);
            openProductDetail(id);
          });
        });
        grid.querySelectorAll('.btn-whatsapp').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = parseInt(this.dataset.id);
            const p = getProductById(id);
            if (p) directWhatsAppOrder(p, 1);
          });
        });
        grid.querySelectorAll('.product-card').forEach(card => {
          card.addEventListener('click', function() {
            const id = parseInt(this.dataset.id);
            openProductDetail(id);
          });
        });
      }

      function renderShop() {
        const categoriesHtml = `
          <div class="categories" id="categoryFilter">
            <button class="category-btn active" data-cat="All">All</button>
            <button class="category-btn" data-cat="Die-Cast Cars">Die-Cast Cars</button>
            <button class="category-btn" data-cat="F1 Cars">F1 Cars</button>
            <button class="category-btn" data-cat="Bikes">Bikes</button>
          </div>
        `;
        main.innerHTML = `<h2 style="margin:30px 0 10px;">Our Collection</h2>` + categoriesHtml + `<div class="product-grid" id="productGrid"></div>`;
        document.querySelectorAll('.category-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentCategory = this.dataset.cat;
            renderProducts();
          });
        });
        renderProducts();
      }

      function renderAbout() {
        main.innerHTML = `
          <div style="max-width:800px; margin:40px auto; background:#121212; padding:40px 30px; border-radius:30px; border:1px solid #2a2a2a;">
            <h2 style="color:#e31b23;">About MJ MINIATURES</h2>
            <p style="font-size:1.2rem; margin-top:20px; color:#ccc;">MJ Miniatures provides quality miniature die-cast cars, F1 cars, bikes and collectibles for collectors, enthusiasts, gifts and display.</p>
            <p style="color:#aaa; margin-top:16px;">We are passionate about miniature models and strive to bring the best to our customers. Every piece is selected for its detail and quality.</p>
          </div>
        `;
      }

      function renderContact() {
        main.innerHTML = `
          <div style="max-width:700px; margin:40px auto; background:#121212; padding:40px 30px; border-radius:30px; border:1px solid #2a2a2a;">
            <h2 style="color:#e31b23;">Contact Us</h2>
            <div style="display:flex; flex-direction:column; gap:20px; margin-top:30px; font-size:1.1rem;">
              <p><i class="fab fa-whatsapp" style="color:#25D366; width:30px;"></i> <a href="https://wa.me/${CONFIG.whatsappNumber}" target="_blank">WhatsApp</a></p>
              <p><i class="fab fa-instagram" style="color:#E1306C; width:30px;"></i> <a href="${CONFIG.instagramUrl}" target="_blank">Instagram</a></p>
              <p><i class="fab fa-youtube" style="color:#FF0000; width:30px;"></i> <a href="${CONFIG.youtubeUrl}" target="_blank">YouTube</a></p>
              <p><i class="fas fa-phone" style="color:#aaa; width:30px;"></i> ${CONFIG.phone}</p>
              <p><i class="fas fa-envelope" style="color:#aaa; width:30px;"></i> ${CONFIG.email}</p>
            </div>
          </div>
        `;
      }

      function navigateTo(page) {
        currentPage = page;
        document.querySelectorAll('.nav-menu a').forEach(a => a.classList.remove('active'));
        document.querySelector(`.nav-menu a[data-page="${page}"]`)?.classList.add('active');
        if (page === 'home') renderHome();
        else if (page === 'shop') renderShop();
        else if (page === 'about') renderAbout();
        else if (page === 'contact') renderContact();
        document.getElementById('navMenu').classList.remove('open');
      }

      function updateCartUI() {
        const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
        cartBadge.textContent = totalItems;
        if (cartItemsDiv) {
          if (cart.length === 0) {
            cartItemsDiv.innerHTML = '<p style="color:#888; padding:20px 0;">Your cart is empty.</p>';
          } else {
            cartItemsDiv.innerHTML = cart.map(item => {
              const p = getProductById(item.id);
              if (!p) return '';
              return `
                <div class="cart-item">
                  <div class="item-info">${p.name} <br><span style="color:#aaa;font-size:0.8rem;">${formatPrice(p.price)}</span></div>
                  <div class="item-qty">
                    <button data-id="${item.id}" data-action="decr">−</button>
                    <span>${item.qty}</span>
                    <button data-id="${item.id}" data-action="incr">+</button>
                    <button data-id="${item.id}" data-action="remove" style="background:#3a1a1a; color:#e31b23; width:28px;">✕</button>
                  </div>
                </div>
              `;
            }).join('');
            cartItemsDiv.querySelectorAll('button').forEach(btn => {
              btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const id = parseInt(this.dataset.id);
                const action = this.dataset.action;
                if (action === 'incr') addToCart(id, 1);
                else if (action === 'decr') addToCart(id, -1);
                else if (action === 'remove') { cart = cart.filter(i => i.id !== id); updateCartUI(); }
              });
            });
          }
          const total = cart.reduce((sum, item) => sum + (getProductById(item.id)?.price || 0) * item.qty, 0);
          cartTotalDiv.textContent = `Total: ${formatPrice(total)}`;
        }
      }

      function addToCart(id, delta = 1) {
        const existing = cart.find(i => i.id === id);
        if (existing) {
          existing.qty = Math.max(1, existing.qty + delta);
        } else {
          cart.push({ id, qty: 1 });
        }
        updateCartUI();
      }

      function directWhatsAppOrder(product, qty) {
        const msg = `Hello MJ Miniatures!%0A%0AI want to order:%0AProduct: ${product.name}%0APrice: ${formatPrice(product.price)}%0AQuantity: ${qty}%0A%0APlease confirm availability and delivery details.`;
        window.open(`https://wa.me/${CONFIG.whatsappNumber}?text=${msg}`, '_blank');
      }

      function openProductDetail(id) {
        const p = getProductById(id);
        if (!p) return;
        let qty = 1;
        const renderModal = () => {
          modalBody.innerHTML = `
            <button class="modal-close" id="modalCloseInner">&times;</button>
            <div class="modal-image-container">
              <img src="${p.image}" alt="${p.name}" onerror="this.src='https://placehold.co/400x300/1a1a1a/e31b23?text=Image+Not+Found'">
            </div>
            <h2 style="margin:12px 0 4px;">${p.name}</h2>
            <div class="price">${formatPrice(p.price)}</div>
            <div class="meta">Category: ${p.category}</div>
            <div class="meta">Scale: ${p.scale || '1:64'} | Material: ${p.material || 'Die-cast'}</div>
            <div class="meta">Color: ${p.color || '—'} | Availability: ${p.availability || 'In Stock'}</div>
            <p style="margin:12px 0;">${p.description}</p>
            <div class="qty-selector">
              <button id="modalQtyDec">−</button>
              <span id="modalQtyDisplay">${qty}</span>
              <button id="modalQtyInc">+</button>
            </div>
            <button class="btn-whatsapp" id="modalOrderBtn" style="width:100%; padding:14px; font-size:1.2rem;"><i class="fab fa-whatsapp"></i> Order on WhatsApp</button>
          `;
          document.getElementById('modalCloseInner')?.addEventListener('click', () => productModal.classList.remove('open'));
          document.getElementById('modalQtyDec')?.addEventListener('click', () => { if(qty>1) qty--; document.getElementById('modalQtyDisplay').textContent=qty; });
          document.getElementById('modalQtyInc')?.addEventListener('click', () => { qty++; document.getElementById('modalQtyDisplay').textContent=qty; });
          document.getElementById('modalOrderBtn')?.addEventListener('click', () => {
            directWhatsAppOrder(p, qty);
          });
        };
        renderModal();
        productModal.classList.add('open');
        productModal.addEventListener('click', function(e) {
          if (e.target === this) this.classList.remove('open');
        });
      }

      document.getElementById('cartIcon').addEventListener('click', () => {
        cartOverlay.classList.add('open');
        updateCartUI();
      });
      document.getElementById('closeCart').addEventListener('click', () => cartOverlay.classList.remove('open'));
      cartOverlay.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('open'); });

      document.getElementById('orderCartBtn').addEventListener('click', function() {
        if (cart.length === 0) { alert('Your cart is empty.'); return; }
        let msg = 'Hello MJ Miniatures!%0A%0AI want to order:%0A';
        let total = 0;
        cart.forEach((item, idx) => {
          const p = getProductById(item.id);
          if (!p) return;
          total += p.price * item.qty;
          msg += `${idx+1}. ${p.name} - ${formatPrice(p.price)} x ${item.qty}%0A`;
        });
        msg += `%0ATotal: ${formatPrice(total)}%0A%0APlease confirm my order.`;
        window.open(`https://wa.me/${CONFIG.whatsappNumber}?text=${msg}`, '_blank');
      });

      document.querySelectorAll('.nav-menu a').forEach(link => {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          navigateTo(this.dataset.page);
        });
      });
      document.getElementById('mobileToggle').addEventListener('click', function() {
        document.getElementById('navMenu').classList.toggle('open');
      });

      document.getElementById('floatWa').addEventListener('click', function() {
        window.open(`https://wa.me/${CONFIG.whatsappNumber}`, '_blank');
      });

      document.getElementById('instagramLink').href = CONFIG.instagramUrl;
      document.getElementById('youtubeLink').href = CONFIG.youtubeUrl;
      document.getElementById('whatsappFooterLink').href = `https://wa.me/${CONFIG.whatsappNumber}`;

      navigateTo('home');
    })();
  </script>
</body>
</html>
