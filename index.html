<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>MJ MINIATURES · Collect. Display. Inspire.</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* --- RESET & GLOBAL --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }
    body {
      background-color: #0b0b0b;
      color: #f0f0f0;
      line-height: 1.6;
      padding: 0 0 80px 0;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 20px;
    }
    /* --- HEADER / NAV --- */
    header {
      background: #0f0f0f;
      border-bottom: 1px solid #2a2a2a;
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    .header-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .logo h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
    }
    .logo span {
      color: #e31b23;
    }
    .logo small {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 3px;
      color: #aaa;
      margin-top: -4px;
    }
    .nav-menu {
      display: flex;
      gap: 28px;
      font-weight: 500;
      font-size: 1rem;
      align-items: center;
    }
    .nav-menu a {
      color: #ccc;
      transition: 0.2s;
      border-bottom: 2px solid transparent;
      padding-bottom: 4px;
      cursor: pointer;
    }
    .nav-menu a:hover,
    .nav-menu a.active {
      color: #fff;
      border-bottom-color: #e31b23;
    }
    .nav-menu .admin-link {
      color: #e31b23;
      border-color: #e31b23;
    }
    .cart-icon {
      position: relative;
      font-size: 1.6rem;
      color: #ddd;
      cursor: pointer;
      margin-left: 10px;
    }
    .cart-icon .badge {
      position: absolute;
      top: -8px;
      right: -12px;
      background: #e31b23;
      color: #fff;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 30px;
      min-width: 22px;
      text-align: center;
    }
    .mobile-toggle {
      display: none;
      font-size: 1.8rem;
      color: #ccc;
      cursor: pointer;
    }
    /* --- HERO --- */
    .hero {
      padding: 70px 0 50px;
      background: linear-gradient(145deg, #0e0e0e, #151515);
      border-radius: 20px;
      margin: 30px 0 40px;
      text-align: center;
      border: 1px solid #282828;
    }
    .hero h2 {
      font-size: 3.4rem;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .hero h2 span {
      color: #e31b23;
    }
    .hero .tagline {
      font-size: 1.6rem;
      color: #bbb;
      margin: 10px 0 20px;
      font-weight: 300;
      letter-spacing: 6px;
    }
    .hero p {
      max-width: 600px;
      margin: 10px auto 30px;
      color: #aaa;
      font-size: 1.1rem;
    }
    .btn-primary {
      background: #e31b23;
      border: none;
      color: #fff;
      padding: 14px 44px;
      font-size: 1.2rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.2s;
      display: inline-block;
      box-shadow: 0 4px 14px rgba(227, 27, 35, 0.3);
    }
    .btn-primary:hover {
      background: #c01018;
      transform: scale(1.02);
    }
    .btn-secondary {
      background: #2a2a2a;
      border: none;
      color: #fff;
      padding: 10px 24px;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.2s;
      display: inline-block;
    }
    .btn-secondary:hover {
      background: #3a3a3a;
    }
    .btn-danger {
      background: #dc3545;
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-danger:hover {
      background: #c82333;
    }
    .btn-success {
      background: #28a745;
      border: none;
      color: #fff;
      padding: 10px 24px;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-success:hover {
      background: #218838;
    }
    /* --- CATEGORIES --- */
    .categories {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin: 40px 0 30px;
    }
    .category-btn {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      color: #ddd;
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.95rem;
    }
    .category-btn.active,
    .category-btn:hover {
      background: #e31b23;
      border-color: #e31b23;
      color: #fff;
    }
    /* --- PRODUCT GRID --- */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 30px;
      margin: 30px 0 50px;
    }
    .product-card {
      background: #121212;
      border-radius: 20px;
      padding: 20px 16px 22px;
      border: 1px solid #282828;
      transition: 0.25s;
      display: flex;
      flex-direction: column;
      box-shadow: 0 6px 12px rgba(0,0,0,0.6);
      position: relative;
    }
    .product-card:hover {
      transform: translateY(-6px);
      border-color: #e31b23;
      box-shadow: 0 12px 24px rgba(227,27,35,0.15);
    }
    .product-card .image-container {
      width: 100%;
      height: 190px;
      background: #1c1c1c;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .product-card .image-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.3s ease;
    }
    .product-card:hover .image-container img {
      transform: scale(1.03);
    }
    .product-card h3 {
      font-size: 1.2rem;
      font-weight: 600;
    }
    .product-card .category-tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #e31b23;
      letter-spacing: 1px;
      margin: 2px 0 6px;
    }
    .product-card .price {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin: 6px 0 10px;
    }
    .product-card .desc {
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 14px;
      flex: 1;
    }
    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }
    .btn-whatsapp,
    .btn-details {
      padding: 8px 14px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.8rem;
      border: none;
      cursor: pointer;
      transition: 0.2s;
      flex: 1 0 auto;
    }
    .btn-whatsapp {
      background: #25D366;
      color: #fff;
    }
    .btn-whatsapp:hover {
      background: #1da855;
    }
    .btn-details {
      background: #2a2a2a;
      color: #ddd;
    }
    .btn-details:hover {
      background: #3a3a3a;
      color: #fff;
    }
    .admin-actions {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 5px;
    }
    .admin-actions button {
      padding: 4px 8px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.7rem;
    }
    .admin-actions .edit-btn {
      background: #ffc107;
      color: #000;
    }
    .admin-actions .delete-btn {
      background: #dc3545;
      color: #fff;
    }
    /* --- WHY CHOOSE --- */
    .why-choose {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
      gap: 30px;
      background: #111;
      padding: 40px 30px;
      border-radius: 30px;
      margin: 40px 0;
      border: 1px solid #262626;
    }
    .why-item {
      text-align: center;
    }
    .why-item i {
      font-size: 2.6rem;
      color: #e31b23;
      margin-bottom: 10px;
    }
    .why-item h4 {
      font-size: 1.2rem;
    }
    .why-item p {
      color: #aaa;
      font-size: 0.9rem;
    }
    /* --- CART OVERLAY --- */
    .cart-overlay {
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.7);
      z-index: 999;
      display: none;
      justify-content: flex-end;
    }
    .cart-overlay.open {
      display: flex;
    }
    .cart-panel {
      background: #111;
      width: 380px;
      max-width: 90%;
      padding: 24px 20px;
      overflow-y: auto;
      border-left: 2px solid #e31b23;
      color: #eee;
    }
    .cart-panel h2 {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #333;
      padding-bottom: 14px;
    }
    .cart-panel .close-cart {
      background: none;
      border: none;
      color: #ccc;
      font-size: 1.8rem;
      cursor: pointer;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #262626;
    }
    .cart-item .item-info {
      flex: 2;
    }
    .cart-item .item-qty {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .cart-item .item-qty button {
      background: #2a2a2a;
      border: none;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
    }
    .cart-item .item-qty span {
      min-width: 24px;
      text-align: center;
    }
    .cart-total {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 20px 0 12px;
    }
    .btn-order-cart {
      background: #25D366;
      color: #fff;
      border: none;
      padding: 14px;
      width: 100%;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1.2rem;
      cursor: pointer;
    }
    /* --- FLOATING WHATSAPP --- */
    .float-wa {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #25D366;
      color: #fff;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
      z-index: 200;
      transition: 0.2s;
      border: none;
      cursor: pointer;
    }
    .float-wa:hover {
      transform: scale(1.08);
    }
    /* --- FOOTER --- */
    footer {
      margin-top: 50px;
      border-top: 1px solid #232323;
      padding: 40px 0 20px;
      text-align: center;
      color: #777;
      font-size: 0.9rem;
    }
    .footer-social a {
      color: #bbb;
      margin: 0 14px;
      font-size: 1.6rem;
      transition: 0.2s;
    }
    .footer-social a:hover {
      color: #e31b23;
    }
    /* --- RESPONSIVE --- */
    @media (max-width: 768px) {
      .mobile-toggle { display: block; }
      .nav-menu {
        display: none;
        flex-direction: column;
        width: 100%;
        padding: 20px 0 10px;
        gap: 18px;
        text-align: center;
      }
      .nav-menu.open { display: flex; }
      .hero h2 { font-size: 2.4rem; }
      .hero .tagline { font-size: 1.2rem; }
      .product-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
      .cart-panel { width: 100%; max-width: 100%; }
    }
    /* --- MODAL --- */
    .modal {
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.open { display: flex; }
    .modal-content {
      background: #181818;
      max-width: 600px;
      width: 100%;
      border-radius: 30px;
      padding: 30px;
      border: 1px solid #333;
      color: #eee;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-content .modal-image-container {
      width: 100%;
      max-height: 300px;
      background: #121212;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .modal-content .modal-image-container img {
      width: 100%;
      height: 100%;
      max-height: 300px;
      object-fit: contain;
    }
    .modal-close {
      position: absolute;
      top: 14px;
      right: 20px;
      font-size: 2rem;
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
    }
    .modal .price { font-size: 1.8rem; color: #e31b23; }
    .modal .meta { color: #aaa; font-size: 0.9rem; margin: 4px 0; }
    .modal .qty-selector {
      display: flex;
      gap: 12px;
      align-items: center;
      margin: 16px 0;
    }
    .modal .qty-selector button {
      background: #2a2a2a;
      border: none;
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 40px;
      font-size: 1.4rem;
      cursor: pointer;
    }
    .modal .qty-selector span {
      font-size: 1.4rem;
      min-width: 40px;
      text-align: center;
    }
    /* --- ADMIN LOGIN --- */
    .login-container {
      max-width: 400px;
      margin: 80px auto;
      background: #121212;
      padding: 40px;
      border-radius: 20px;
      border: 1px solid #282828;
    }
    .login-container h2 {
      text-align: center;
      color: #e31b23;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #aaa;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      border-radius: 8px;
      font-size: 1rem;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #e31b23;
    }
    .form-group textarea {
      min-height: 80px;
      resize: vertical;
    }
    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .form-actions button {
      flex: 1;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 30px 0 20px;
    }
    .admin-header h2 {
      color: #e31b23;
    }
    .admin-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin: 20px 0 30px;
    }
    .stat-card {
      background: #121212;
      padding: 20px;
      border-radius: 15px;
      border: 1px solid #282828;
      text-align: center;
    }
    .stat-card .number {
      font-size: 2.5rem;
      font-weight: 700;
      color: #e31b23;
    }
    .stat-card .label {
      color: #aaa;
      margin-top: 5px;
    }
    .admin-product-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      background: #121212;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid #282828;
    }
    .admin-product-item:hover {
      border-color: #e31b23;
    }
    .admin-product-item .product-info {
      flex: 1;
    }
    .admin-product-item .product-info h4 {
      color: #fff;
    }
    .admin-product-item .product-info p {
      color: #aaa;
      font-size: 0.9rem;
    }
    .admin-product-item .product-actions {
      display: flex;
      gap: 8px;
    }
    .admin-product-item .product-actions button {
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .alert {
      padding: 12px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .alert-success {
      background: #1a3a1a;
      color: #4caf50;
      border: 1px solid #4caf50;
    }
    .alert-error {
      background: #3a1a1a;
      color: #e31b23;
      border: 1px solid #e31b23;
    }
    .search-box {
      margin: 20px 0;
    }
    .search-box input {
      width: 100%;
      max-width: 400px;
      padding: 10px 16px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      border-radius: 30px;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-wrapper">
      <div class="logo">
        <h1>MJ <span>MINIATURES</span></h1>
        <small>Collect. Display. Inspire.</small>
      </div>
      <div class="mobile-toggle" id="mobileToggle"><i class="fas fa-bars"></i></div>
      <nav class="nav-menu" id="navMenu">
        <a class="active" data-page="home">Home</a>
        <a data-page="shop">Shop</a>
        <a data-page="about">About</a>
        <a data-page="contact">Contact</a>
        <a data-page="admin" class="admin-link"><i class="fas fa-user-shield"></i> Admin</a>
      </nav>
      <div class="cart-icon" id="cartIcon">
        <i class="fas fa-shopping-cart"></i>
        <span class="badge" id="cartBadge">0</span>
      </div>
    </div>
  </header>

  <main class="container" id="mainContent"></main>

  <button class="float-wa" id="floatWa" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></button>

  <div class="cart-overlay" id="cartOverlay">
    <div class="cart-panel">
      <h2>🛒 Your Cart <button class="close-cart" id="closeCart">&times;</button></h2>
      <div id="cartItems"></div>
      <div class="cart-total" id="cartTotal">Total: ₹0</div>
      <button class="btn-order-cart" id="orderCartBtn"><i class="fab fa-whatsapp"></i> Order Cart on WhatsApp</button>
    </div>
  </div>

  <div class="modal" id="productModal">
    <div class="modal-content" id="modalContent">
      <button class="modal-close" id="modalClose">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Admin Product Modal -->
  <div class="modal" id="adminProductModal">
    <div class="modal-content">
      <button class="modal-close" id="adminModalClose">&times;</button>
      <h2 id="adminModalTitle">Add Product</h2>
      <form id="adminProductForm">
        <div class="form-group">
          <label>Product Name *</label>
          <input type="text" id="adminProductName" required placeholder="Enter product name">
        </div>
        <div class="form-group">
          <label>Description *</label>
          <textarea id="adminProductDesc" required placeholder="Enter product description"></textarea>
        </div>
        <div class="form-group">
          <label>Price (₹) *</label>
          <input type="number" id="adminProductPrice" required placeholder="Enter price" step="0.01">
        </div>
        <div class="form-group">
          <label>Category *</label>
          <select id="adminProductCategory" required>
            <option value="Die-Cast Cars">Die-Cast Cars</option>
            <option value="F1 Cars">F1 Cars</option>
            <option value="Bikes">Bikes</option>
          </select>
        </div>
        <div class="form-group">
          <label>Image URL</label>
          <input type="text" id="adminProductImage" placeholder="https://example.com/image.jpg">
        </div>
        <div class="form-group">
          <label>Scale</label>
          <input type="text" id="adminProductScale" placeholder="1:64">
        </div>
        <div class="form-group">
          <label>Material</label>
          <input type="text" id="adminProductMaterial" placeholder="Zinc Alloy">
        </div>
        <div class="form-group">
          <label>Color</label>
          <input type="text" id="adminProductColor" placeholder="Red">
        </div>
        <div class="form-group">
          <label>Availability</label>
          <select id="adminProductAvailability">
            <option value="In Stock">In Stock</option>
            <option value="Pre-order">Pre-order</option>
            <option value="Out of Stock">Out of Stock</option>
          </select>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="adminProductFeatured"> Featured Product
          </label>
        </div>
        <input type="hidden" id="adminProductId">
        <div class="form-actions">
          <button type="submit" class="btn-success" style="flex:1;">Save Product</button>
          <button type="button" class="btn-secondary" id="adminCancelBtn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <footer>
    <div class="footer-social">
      <a href="#" id="instagramLink" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="#" id="youtubeLink" target="_blank"><i class="fab fa-youtube"></i></a>
      <a href="#" id="whatsappFooterLink" target="_blank"><i class="fab fa-whatsapp"></i></a>
    </div>
    <p style="margin-top:16px;">&copy; 2026 MJ MINIATURES — All rights reserved.</p>
  </footer>

  <script>
    (function() {
      // ============================================================
      //  CONFIGURATION - EDIT THESE VALUES
      // ============================================================
      const CONFIG = {
        whatsappNumber: '7339167220',
        instagramUrl: 'https://instagram.com/mjminiatures',
        youtubeUrl: 'https://youtube.com/mjminiatures',

      // ===== Helper functions =====
      function formatPrice(p) { return '₹' + p; }
      function getProductById(id) { return products.find(p => p.id === id); }

      // ===== Cart functions =====
      function loadCart() {
        const saved = localStorage.getItem('cart');
        if (saved) {
          try { cart = JSON.parse(saved); } catch(e) { cart = []; }
        }
        updateCartUI();
      }

      function saveCart() {
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartUI();
      }

      function updateCartUI() {
        const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
        cartBadge.textContent = totalItems;
        
        if (cartItemsDiv) {
          if (cart.length === 0) {
            cartItemsDiv.innerHTML = '<p style="color:#888; padding:20px 0;">Your cart is empty.</p>';
            cartTotalDiv.textContent = 'Total: ₹0';
            return;
          }
          
          let total = 0;
          cartItemsDiv.innerHTML = cart.map(item => {
            const p = getProductById(item.id);
            if (!p) return '';
            const subtotal = p.price * item.quantity;
            total += subtotal;
            return `
              <div class="cart-item">
                <div class="item-info">
                  <strong>${p.name}</strong>
                  <br><span style="color:#aaa;">${formatPrice(p.price)} x ${item.quantity}</span>
                </div>
                <div class="item-qty">
                  <button onclick="window.updateCartQty(${item.id}, -1)">−</button>
                  <span>${item.quantity}</span>
                  <button onclick="window.updateCartQty(${item.id}, 1)">+</button>
                  <button onclick="window.removeFromCart(${item.id})" style="background:#3a1a1a; color:#e31b23; width:28px;">✕</button>
                </div>
              </div>
            `;
          }).join('');
          cartTotalDiv.textContent = `Total: ${formatPrice(total)}`;
        }
      }

      window.updateCartQty = function(id, delta) {
        const item = cart.find(i => i.id === id);
        if (!item) return;
        item.quantity += delta;
        if (item.quantity <= 0) {
          cart = cart.filter(i => i.id !== id);
        }
        saveCart();
      };

      window.removeFromCart = function(id) {
        cart = cart.filter(i => i.id !== id);
        saveCart();
      };

      function addToCart(productId) {
        const existing = cart.find(i => i.id === productId);
        if (existing) {
          existing.quantity += 1;
        } else {
          cart.push({ id: productId, quantity: 1 });
        }
        saveCart();
      }

      // ===== Render functions =====

        const hero = `

        document.querySelectorAll('.category-btn').forEach(btn => {

        grid.innerHTML = filtered.map(p => `

      function renderShop() {

      // ===== Admin Functions =====
      function renderAdmin() {

      function renderAdminLogin() {

            isAdminLoggedIn = true;
            renderAdminDashboard();
          } else {
            alert('Incorrect password!');
          }
        });

      function renderAdminDashboard() {
        const totalProducts = products.length;
        const featuredProducts = products.filter(p => p.featured).length;
        
        main.innerHTML = `
          <div class="admin-header">
            <h2><i class="fas fa-user-shield"></i> Admin Dashboard</h2>
            <div>
              <button class="btn-success" onclick="window.openAdminModal()"><i class="fas fa-plus"></i> Add Product</button>

                  <button class="btn-secondary" onclick="window.editProduct(${p.id})"><i class="fas fa-edit"></i></button>
                  <button class="btn-danger" onclick="window.deleteProduct(${p.id})"><i class="fas fa-trash"></i></button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      window.adminLogout = function() {
        isAdminLoggedIn = false;
        renderAdminLogin();
      };

      window.filterAdminProducts = function() {
        const search = document.getElementById('adminSearch').value.toLowerCase();
        const items = document.querySelectorAll('.admin-product-item');
        items.forEach(item => {
          const name = item.dataset.name;
          item.style.display = name.includes(search) ? 'flex' : 'none';
        });
      };

      window.openAdminModal = function(productId = null) {
        editingProductId = productId;
        const modal = document.getElementById('adminProductModal');
        const title = document.getElementById('adminModalTitle');
        
        if (productId) {
          const p = getProductById(productId);
          if (!p) return;
          title.textContent = 'Edit Product';
          document.getElementById('adminProductName').value = p.name;
          document.getElementById('adminProductDesc').value = p.description;
          document.getElementById('adminProductPrice').value = p.price;
          document.getElementById('adminProductCategory').value = p.category;
          document.getElementById('adminProductImage').value = p.image || '';
          document.getElementById('adminProductScale').value = p.scale || '';
          document.getElementById('adminProductMaterial').value = p.material || '';
          document.getElementById('adminProductColor').value = p.color || '';
          document.getElementById('adminProductAvailability').value = p.availability || 'In Stock';
          document.getElementById('adminProductFeatured').checked = p.featured || false;
          document.getElementById('adminProductId').value = productId;
        } else {
          title.textContent = 'Add Product';
          document.getElementById('adminProductForm').reset();
          document.getElementById('adminProductId').value = '';
          document.getElementById('adminProductFeatured').checked = false;
        }
        modal.classList.add('open');
      };

      window.editProduct = function(id) {
        window.openAdminModal(id);
      };

      window.deleteProduct = function(id) {
        if (!confirm('Are you sure you want to delete this product?')) return;
        products = products.filter(p => p.id !== id);
        renderAdminDashboard();
        renderProducts();
        updateCartUI();
      };

      // Admin form submit
      document.getElementById('adminProductForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const id = document.getElementById('adminProductId').value;
        const productData = {
          name: document.getElementById('adminProductName').value,
          description: document.getElementById('adminProductDesc').value,
          price: parseFloat(document.getElementById('adminProductPrice').value),
          category: document.getElementById('adminProductCategory').value,
          image: document.getElementById('adminProductImage').value || 'https://placehold.co/400x300/1a1a1a/e31b23?text=MJ',
          scale: document.getElementById('adminProductScale').value,
          material: document.getElementById('adminProductMaterial').value,
          color: document.getElementById('adminProductColor').value,
          availability: document.getElementById('adminProductAvailability').value,
          featured: document.getElementById('adminProductFeatured').checked
        };

        if (id) {
          // Edit existing
          const index = products.findIndex(p => p.id === parseInt(id));
          if (index !== -1) {
            products[index] = { ...products[index], ...productData };
          }
        } else {
          // Add new
          productData.id = nextId++;
          products.push(productData);
        }

        document.getElementById('adminProductModal').classList.remove('open');
        renderAdminDashboard();
        renderProducts();
        updateCartUI();
        alert(id ? 'Product updated successfully!' : 'Product added successfully!');
      });

      document.getElementById('adminCancelBtn').addEventListener('click', function() {
        document.getElementById('adminProductModal').classList.remove('open');
      });

      document.getElementById('adminModalClose').addEventListener('click', function() {
        document.getElementById('adminProductModal').classList.remove('open');
      });

      // ===== View Product Modal =====
      window.viewProduct = function(id) {
        const p = getProductById(id);
        if (!p) return;
        let qty = 1;
        const renderModal = () => {
          modalBody.innerHTML = `
            <button class="modal-close" id="modalCloseInner">&times;</button>
            <div class="modal-image-container">
              <img src="${p.image || 'https://placehold.co/600x400/1a1a1a/e31b23?text=MJ'}" alt="${p.name}">

            <h2 style="margin:12px 0 4px;">${p.name}</h2>
            <div class="price">${formatPrice(p.price)}</div>
            <div class="meta">Category: ${p.category}</div>
            <div class="meta">Scale: ${p.scale || '1:64'} | Material: ${p.material || 'Die-cast'}</div>
            <div class="meta">Color: ${p.color || '—'} | Availability: ${p.availability || 'In Stock'}</div>
            <p style="margin:12px 0;">${p.description}</p>
            <div class="qty-selector">
              <button id="modalQtyDec">−</button>
              <span id="modalQtyDisplay">${qty}</span>
              <button id="modalQtyInc">+</button>
            </div>
            <button class="btn-whatsapp" id="modalOrderBtn" style="width:100%; padding:14px; font-size:1.2rem;">
              <i class="fab fa-whatsapp"></i> Order on WhatsApp
            </button>
          `;
          document.getElementById('modalCloseInner')?.addEventListener('click', () => productModal.classList.remove('open'));
          document.getElementById('modalQtyDec')?.addEventListener('click', () => { if(qty>1) qty--; document.getElementById('modalQtyDisplay').textContent=qty; });
          document.getElementById('modalQtyInc')?.addEventListener('click', () => { qty++; document.getElementById('modalQtyDisplay').textContent=qty; });
          document.getElementById('modalOrderBtn')?.addEventListener('click', () => {
            const msg = `Hello MJ Miniatures!%0A%0AI want to order:%0AProduct: ${p.name}%0APrice: ${formatPrice(p.price)}%0AQuantity: ${qty}%0A%0APlease confirm availability and delivery details.`;
            window.open(`https://wa.me/${CONFIG.whatsappNumber}?text=${msg}`, '_blank');
          });
        };
        renderModal();
        productModal.classList.add('open');
        productModal.addEventListener('click', function(e) {
          if (e.target === this) this.classList.remove('open');
        });
      };

      document.getElementById('modalClose').addEventListener('click', () => productModal.classList.remove('open'));

      // ===== Navigation =====
      function navigateTo(page) {
        currentPage = page;
        document.querySelectorAll('.nav-menu a').forEach(a => a.classList.remove('active'));
        document.querySelector(`.nav-menu a[data-page="${page}"]`)?.classList.add('active');
        
        if (page === 'home') renderHome();
        else if (page === 'shop') renderShop();
        else if (page === 'about') renderAbout();
        else if (page === 'contact') renderContact();
        else if (page === 'admin') renderAdmin();
        
        document.getElementById('navMenu').classList.remove('open');
      }

      document.querySelectorAll('.nav-menu a').forEach(link => {
        link.addEventListener('click', function() {
          navigateTo(this.dataset.page);
        });
      });

      document.getElementById('mobileToggle').addEventListener('click', function() {
        document.getElementById('navMenu').classList.toggle('open');
      });

      // ===== Cart Overlay =====
      document.getElementById('cartIcon').addEventListener('click', () => {
        cartOverlay.classList.add('open');
        updateCartUI();
      });
      document.getElementById('closeCart').addEventListener('click', () => cartOverlay.classList.remove('open'));
      cartOverlay.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('open'); });

      // ===== Order Cart =====
      document.getElementById('orderCartBtn').addEventListener('click', function() {
        if (cart.length === 0) { alert('Your cart is empty.'); return; }
        let msg = 'Hello MJ Miniatures!%0A%0AI want to order:%0A';
        let total = 0;
        cart.forEach((item, idx) => {
          const p = getProductById(item.id);
          if (!p) return;
          total += p.price * item.quantity;
          msg += `${idx+1}. ${p.name} - ${formatPrice(p.price)} x ${item.quantity}%0A`;
        });
        msg += `%0ATotal: ${formatPrice(total)}%0A%0APlease confirm my order.`;
        window.open(`https://wa.me/${CONFIG.whatsappNumber}?text=${msg}`, '_blank');
      });

      // ===== Floating WhatsApp =====
      document.getElementById('floatWa').addEventListener('click', function() {
        window.open(`https://wa.me/${CONFIG.whatsappNumber}`, '_blank');
      });

      // ===== Footer Social Links =====
      document.getElementById('instagramLink').href = CONFIG.instagramUrl;
      document.getElementById('youtubeLink').href = CONFIG.youtubeUrl;
      document.getElementById('whatsappFooterLink').href = `https://wa.me/${CONFIG.whatsappNumber}`;

      // ===== Expose functions globally =====
      window.addToCart = addToCart;
      window.viewProduct = viewProduct;
      window.editProduct = editProduct;
      window.deleteProduct = deleteProduct;
      window.openAdminModal = openAdminModal;

      // ===== INIT =====
      loadCart();
      navigateTo('home');
    })();
  </script>
